version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: erp_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: construction_erp
    volumes:
      - mongodb_data:/data/db
    networks:
      - erp_network

  redis:
    image: redis:7-alpine
    container_name: erp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - erp_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/construction_erp?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your_secure_jwt_secret_change_in_production
      JWT_REFRESH_SECRET: your_secure_refresh_secret_change_in_production
      JWT_EXPIRE: 15m
      JWT_REFRESH_EXPIRE: 7d
      APP_URL: http://localhost:3000
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - erp_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: erp_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - erp_network

volumes:
  mongodb_data:

networks:
  erp_network:
    driver: bridge
